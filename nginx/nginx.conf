# nginx/nginx.conf — Proxy do Coliseu Estoque (HTTP; o SSL é do Coolify/Traefik).
# Tudo vai para a estoque-api, que serve a API e o dashboard.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile          on;
    keepalive_timeout 65;
    # Lotes de sincronismo do Worker (documentos/produtos) chegam a alguns MB.
    client_max_body_size 25M;

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript;

    upstream estoque_api {
        server estoque-api:3100;
        keepalive 32;
    }

    map $http_x_forwarded_proto $proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Tempo real (SSE): sem buffer e conexão longa.
        location = /v1/stream {
            proxy_pass         http://estoque_api;
            proxy_buffering    off;
            proxy_cache        off;
            gzip               off;
            proxy_read_timeout 24h;
        }

        location /health {
            proxy_pass http://estoque_api;
            access_log off;
        }

        location / {
            proxy_pass http://estoque_api;
        }
    }
}
