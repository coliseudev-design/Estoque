# nginx/nginx.conf — Reverse Proxy para Coliseu Speed (HTTP only)
# Coolify/Traefik gerencia SSL externamente.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain application/json application/javascript text/css;

    upstream middleware {
        server speed-middleware:3000;
        keepalive 32;
    }

    upstream admin_panel {
        server admin-panel:8000;
        keepalive 32;
    }

    upstream speed_web {
        server coliseu-speed-web:8001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Root route - Sales Force Web Client
        location / {
            proxy_pass         http://speed_web;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # SaaS Admin Panel
        location /adm {
            proxy_pass         http://admin_panel;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # API endpoints to speed-middleware
        location /api {
            proxy_pass         http://middleware;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location /health {
            proxy_pass http://middleware;
            access_log off;
        }

        location /metrics {
            proxy_pass http://middleware;
            access_log off;
        }
    }
}
