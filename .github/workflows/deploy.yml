# ================================================================
# ColiseSpeed — CI/CD Pipeline
# ================================================================
# Trigger: push para main (apenas arquivos relevantes)
# Fluxo: Test → Build → Deploy via Coolify webhook
# ================================================================

name: 🚀 Deploy ColiseSpeed

on:
  push:
    branches: [main]
    paths:
      - 'middleware/**'
      - 'nginx/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Pular testes'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────
  # Job 1: Lint & Test
  # ──────────────────────────────────────
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    defaults:
      run:
        working-directory: middleware

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: middleware/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Testes
        run: npm test --if-present
        env:
          NODE_ENV: test

  # ──────────────────────────────────────
  # Job 2: Build Docker Image
  # ──────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Build middleware
        run: docker build -t colisespeed-middleware:${{ github.sha }} ./middleware

      - name: Build nginx
        run: docker build -t colisespeed-nginx:${{ github.sha }} ./nginx

      - name: Verificar imagens
        run: |
          docker images | grep colisespeed
          echo "✅ Imagens construídas com sucesso"

  # ──────────────────────────────────────
  # Job 3: Deploy via Coolify
  # ──────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify Deploy
        run: |
          echo "🔄 Disparando deploy no Coolify..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Deploy disparado com sucesso (HTTP $HTTP_STATUS)"
          else
            echo "❌ Falha ao disparar deploy (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Aguardar deploy
        run: |
          echo "⏳ Aguardando 45 segundos para o deploy completar..."
          sleep 45

      - name: Health Check
        run: |
          echo "🏥 Verificando saúde da aplicação..."
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ secrets.APP_DOMAIN }}/health" \
              --max-time 10)
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Aplicação saudável! (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "⏳ Tentativa $i/12 — HTTP $HTTP_STATUS"
            sleep 10
          done
          echo "❌ Health check falhou após 12 tentativas"
          exit 1

  # ──────────────────────────────────────
  # Job 4: Notificação
  # ──────────────────────────────────────
  notify:
    name: 📢 Notificar
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Resultado do deploy
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deploy do ColiseSpeed concluído com sucesso!"
            echo "🌐 URL: https://${{ secrets.APP_DOMAIN }}"
          else
            echo "❌ Deploy do ColiseSpeed falhou!"
            echo "📋 Verifique os logs no Coolify"
          fi
