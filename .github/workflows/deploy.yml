# ================================================================
# Coliseu Estoque — CI/CD
# push na main → testes → build da imagem → deploy no Coolify → health check
# ================================================================

name: 🚀 Deploy Coliseu Estoque

on:
  push:
    branches: [main]
    paths:
      - 'estoque-api/**'
      - 'dashboard/**'
      - 'nginx/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Pular testes'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    defaults:
      run:
        working-directory: estoque-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: estoque-api/package-lock.json
      - run: npm ci
      - name: Sintaxe
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ../dashboard/app.js
      - name: Testes
        run: npm test
        env:
          NODE_ENV: test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Build estoque-api (com dashboard)
        run: docker build -f estoque-api/Dockerfile -t coliseu-estoque-api:${{ github.sha }} .
      - name: Build nginx
        run: docker build -t coliseu-estoque-nginx:${{ github.sha }} ./nginx

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Disparar deploy no Coolify
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Deploy disparado (HTTP $HTTP_STATUS)"
          else
            echo "❌ Falha ao disparar deploy (HTTP $HTTP_STATUS)"; exit 1
          fi

      - name: Health check
        run: |
          sleep 45
          for i in $(seq 1 18); do
            BODY=$(curl -s --max-time 10 "https://${{ secrets.APP_DOMAIN }}/health" || true)
            if echo "$BODY" | grep -q '"postgres":true'; then
              echo "✅ Coliseu Estoque no ar: $BODY"; exit 0
            fi
            echo "⏳ Tentativa $i/18 — $BODY"; sleep 10
          done
          echo "❌ Health check falhou"; exit 1
