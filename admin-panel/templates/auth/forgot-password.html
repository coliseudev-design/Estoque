<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha — ColiseuSpeed</title>
    <link rel="stylesheet" href="/adm/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="justify-content: center; align-items: center;">

    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="brand-logo login-logo">CS</div>
                <h2 style="font-weight: 700; font-size: 1.5rem; margin-top: 10px;">Recuperar Senha</h2>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">Insira seu e-mail para receber um link de redefinição</p>
            </div>

            {% if success_message %}
                <div style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); color: var(--success); padding: 12px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; text-align: center;">
                    {{ success_message }}
                </div>
            {% endif %}

            <form action="/adm/auth/forgot-password" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="email" class="form-label">E-mail Cadastrado</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@coliseusistemas.com.br" required>
                </div>

                <button type="submit" class="btn btn-primary" style="justify-content: center; width: 100%; margin-top: 10px;">
                    <span>Enviar Link de Recuperação</span>
                </button>
                
                <a href="/adm/login" class="btn btn-secondary" style="justify-content: center; text-decoration: none;">
                    <span>Voltar para o Login</span>
                </a>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
