name: coliseu_estoque
description: "Coliseu Estoque — conferência cega e separação, offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'   # Flutter 3.27+

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP com interceptors (token, timeout)
  dio: ^5.7.0
  # Banco local: fila de leituras offline e cache do catálogo
  sqflite: ^2.4.1
  path: ^1.9.0
  # Detecta volta da conexão para descarregar a fila
  connectivity_plus: ^6.1.0
  # Leitura pela câmera (EAN-13, EAN-8, Code128, DUN-14, QR)
  mobile_scanner: ^7.0.1
  shared_preferences: ^2.3.3
  device_info_plus: ^11.1.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
