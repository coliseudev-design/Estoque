# nginx/nginx.conf — Reverse Proxy para Coliseu Identity Admin
# Coolify/Traefik gerencia SSL externamente.
#
# ARQUITETURA:
#   - nginx serve o React Admin SPA (arquivos estáticos em /usr/share/nginx/html)
#   - nginx faz proxy de /admin/*, /api/*, /auth/*, /health para identity:8080

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=5r/m;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr '
                    'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain application/json application/javascript text/css;

    # ── Upstream Identity API (.NET 8 em porta 8080) ────────────────────────
    # max_fails=2: após 2 falhas consecutivas, marca o backend como indisponível
    # fail_timeout=15s: aguarda 15s antes de tentar novamente
    upstream identity_backend {
        server identity:8080 max_fails=2 fail_timeout=15s;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ── Upstream Sales API Middleware (Node.js em porta 3000) ────────────────
    upstream middleware_backend {
        server middleware:3000 max_fails=2 fail_timeout=15s;
        keepalive 8;
        keepalive_requests 200;
        keepalive_timeout 60s;
    }

    # ── Proxy defaults (reutilizado em todos os locations) ───────────────────
    # proxy_read_timeout 120s: evita 504 quando o .NET está fazendo migration
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection        "";
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      120s;
    proxy_next_upstream     error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    server {
        listen 80;
        server_name _;

        # ── Página de erro amigável quando o backend está reiniciando ────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
            default_type text/html;
            return 503 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Coliseu Identity — Aguarde</title><style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f0f4f8}div{text-align:center;padding:2rem;background:white;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}</style></head><body><div><h2>🔄 Serviço em reinicialização</h2><p>O servidor está sendo atualizado. Tente novamente em alguns segundos.</p><button onclick="location.reload()">Tentar novamente</button></div></body></html>';
        }

        # ── Auth endpoints — rate limited agressivamente ─────────────────────
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://identity_backend;
        }

        location /internal/ {
            proxy_pass http://identity_backend;
        }

        # ── Admin API ────────────────────────────────────────────────────────
        location /admin/ {
            limit_req zone=global burst=20;
            proxy_pass http://identity_backend;
        }

        # ── Sales API Admin Services — proxy seguro com chave injetada server-side ──
        # $ADMIN_API_KEY é substituído pelo envsubst na inicialização do container
        # (ver Dockerfile CMD). A chave nunca aparece no bundle JS do frontend.
        location /api/sales/admin/ {
            limit_req zone=global burst=20;
            proxy_pass         http://middleware_backend/api/admin/;
            proxy_set_header   Admin-Api-Key  $ADMIN_API_KEY;
            proxy_set_header   Host           middleware;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection     "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ── Sales API Health — proxy same-origin para evitar bloqueio CORP ───────
        # O middleware retorna Cross-Origin-Resource-Policy: same-origin (helmet).
        # fetch() com mode:no-cors de outra origem seria bloqueado. Este proxy
        # permite que o Dashboard consulte o health sem erros de CORP.
        location /api/sales/health {
            proxy_pass         http://middleware_backend/health;
            proxy_set_header   Host           middleware;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   Connection     "";
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            access_log         off;
        }

        # ── API endpoints (Identity backend) ─────────────────────────────────
        location /api/ {
            limit_req zone=global burst=30;
            proxy_pass http://identity_backend;
        }

        # ── Health check (público, sem log, sem rate limit) ──────────────────
        location /health {
            proxy_pass         http://identity_backend;
            proxy_read_timeout 5s;
            access_log         off;
        }

        # ── Swagger (apenas para dev/staging) ─────────────────────────────────
        location /swagger {
            proxy_pass http://identity_backend;
        }

        # ── React SPA — serve index.html para qualquer rota não reconhecida ──
        # O React Router cuida do roteamento client-side.
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
