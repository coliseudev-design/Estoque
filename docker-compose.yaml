# ================================================================
# ColiseSpeed — Docker Compose PRODUÇÃO
# ================================================================
# PostgreSQL e Redis removidos — usar os do Coolify central
# Apenas middleware + nginx, conectados à rede coolify
# Deploy: speed.coliseusistemas.com.br
# ================================================================

services:

  # ── Node.js Middleware ──────────────────────────────────────────
  speed-middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-coliseuspeed}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_SSL: ${PG_SSL:-false}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_ID: ${COMPANY_ID:-}
      FB_MOCK: ${FB_MOCK:-true}
      SYNC_MODE: ${SYNC_MODE:-async}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coolify

  # ── Nginx — Reverse Proxy ──────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    depends_on:
      speed-middleware:
        condition: service_started
    networks:
      - coolify

  # ── SaaS Admin Panel ───────────────────────────────────────────
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://${PG_USER:-coliseu_admin}:${POSTGRES_PASSWORD}@${PG_HOST:-coliseu-db}:5432/${PG_DATABASE:-coliseu_identity}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
      - JWT_SECRET=${JWT_ACCESS_SECRET:-747a7da7a7b9317b9c6a7880abcdef1234567890abcdef1234567890abcdef12}
      - SALES_API_URL=https://licencas.coliseusistemas.com.br
      - SEED_ADMIN_EMAIL=admin@coliseu.com.br
      - SEED_ADMIN_PASSWORD=98683818
    depends_on:
      speed-middleware:
        condition: service_started
    networks:
      - coolify

# ── Volumes & Networks ────────────────────────────────────────────
networks:
  coolify:
    external: true


