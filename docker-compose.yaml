# ================================================================
# Coliseu Estoque — Docker Compose PRODUÇÃO (Coolify)
# Domínio: estoque.coliseusistemas.com.br  →  serviço "nginx"
# ================================================================
# estoque-api serve a API (/v1, /internal/v1) E o dashboard (/).
# Banco próprio do módulo (estoque-db), isolado dos demais sistemas.
#
# Variáveis no Coolify:
#   JWT_ACCESS_SECRET           = Jwt:DeviceSigningKey do Coliseu.Identity (já existia)
#   INTERNAL_API_KEY            = chave interna do Identity (já existia)
#   ESTOQUE_MODULE_SLUG         = slug do módulo "Estoque Coliseu" no painel (padrão: estoque)
#   SERVICE_PASSWORD_ESTOQUEDB  e SERVICE_BASE64_64_ESTOQUEJWT são gerados pelo Coolify.
#
# O stack de vendas (middleware, coliseu-speed-web, admin-panel) NÃO é
# publicado por este repositório — ele roda em speed.coliseusistemas.com.br.
# ================================================================

services:

  estoque-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: coliseu_estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_ESTOQUEDB}
    volumes:
      - estoque_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d coliseu_estoque"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - coolify

  estoque-api:
    build:
      context: .
      dockerfile: estoque-api/Dockerfile
    restart: always
    depends_on:
      estoque-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgres://estoque:${SERVICE_PASSWORD_ESTOQUEDB}@estoque-db:5432/coliseu_estoque
      PG_SSL: "false"
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-https://adminlicencas.coliseusistemas.com.br}
      IDENTITY_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ESTOQUE_MODULE_SLUG: ${ESTOQUE_MODULE_SLUG:-estoque}
      ESTOQUE_JWT_SECRET: ${SERVICE_BASE64_64_ESTOQUEJWT}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_HOPS: "2"   # Traefik (Coolify) + nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coolify

  # Mantido com o mesmo nome: o domínio no Coolify continua vinculado a ele.
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    depends_on:
      estoque-api:
        condition: service_started
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  estoque_pg_data:
