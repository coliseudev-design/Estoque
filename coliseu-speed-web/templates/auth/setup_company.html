<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coliseu Speed — Vincular Empresa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      background: #f0f4f8;
      overflow: hidden;
    }

    /* ── Painel esquerdo ── */
    .left-panel {
      flex: 1;
      background: linear-gradient(145deg, #0d3b6e 0%, #1a7cc7 45%, #3aabdf 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 50px;
      position: relative;
      overflow: hidden;
    }

    /* Círculos decorativos de fundo */
    .left-panel::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 60px solid rgba(255,255,255,0.06);
      top: -150px;
      left: -150px;
    }
    .left-panel::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 50px solid rgba(255,255,255,0.06);
      bottom: -120px;
      right: -100px;
    }

    .left-panel .brand-logo {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .left-panel .brand-logo span {
      color: #3aabdf;
    }

    .left-panel .tagline {
      color: rgba(255,255,255,0.92);
      font-size: 1.35rem;
      font-weight: 300;
      text-align: center;
      line-height: 1.6;
      max-width: 340px;
      position: relative;
      z-index: 1;
    }

    .left-panel .tagline strong {
      color: #ffffff;
      font-weight: 700;
      display: block;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    /* ── Painel direito (formulário) ── */
    .right-panel {
      width: 480px;
      min-width: 380px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 50px;
      box-shadow: -8px 0 40px rgba(0,0,0,0.08);
      position: relative;
      z-index: 2;
    }

    .form-header {
      width: 100%;
      margin-bottom: 36px;
    }

    .form-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e2d3d;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 0.95rem;
      color: #8a9ab0;
      font-weight: 400;
    }

    /* Formulário */
    .setup-form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4d5358;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 16px;
      color: #b0bec5;
      font-size: 1.1rem;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border: 1.5px solid #e0e7ef;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: 'Nunito', sans-serif;
      color: #1e2d3d;
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: #1a7cc7;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(26, 124, 199, 0.12);
    }

    .btn-link {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #1a7cc7 0%, #3aabdf 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 18px rgba(26, 124, 199, 0.35);
      margin-top: 10px;
    }

    .btn-link:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(26, 124, 199, 0.45);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #8a9ab0;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #1a7cc7;
    }

    /* Versão mobile */
    @media (max-width: 768px) {
      body { flex-direction: column; overflow: auto; }
      .left-panel {
        padding: 40px 30px;
        flex: none;
        min-height: 180px;
      }
      .left-panel .tagline { font-size: 1rem; }
      .left-panel .tagline strong { font-size: 1.2rem; }
      .right-panel {
        width: 100%;
        min-width: unset;
        padding: 40px 28px;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <!-- ── Painel esquerdo ── -->
  <div class="left-panel">
    <div class="brand-logo">Coliseu<span>Speed</span></div>
    <p class="tagline">
      <strong>Vincule seu Aparelho</strong>
      Insira os dados de licenciamento da sua empresa para sincronizar as tabelas.
    </p>
  </div>

  <!-- ── Painel direito ── -->
  <div class="right-panel">
    <div class="form-header">
      <h1>Configuração de Licença 🔑</h1>
      <p>Insira a chave de acesso do módulo gerada no Painel Admin</p>
    </div>

    {% if error_message %}
        <div style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); color: #ef4444; padding: 12px; border-radius: 10px; font-size: 0.85rem; width: 100%; margin-bottom: 20px; text-align: center;">
            {{ error_message }}
        </div>
    {% endif %}

    <form class="setup-form" method="POST" action="/setup-company">
      <div class="form-group">
        <label for="api_key">Chave de Acesso / Token do Módulo</label>
        <div class="input-wrapper">
          <span class="icon">🔑</span>
          <input
            type="text"
            id="api_key"
            name="api_key"
            placeholder="cs_key_..."
            required
            autofocus
          />
        </div>
      </div>

      <button type="submit" class="btn-link">Vincular Empresa</button>
    </form>

    <a href="/login" class="back-link">← Voltar para o login</a>
  </div>
</body>
</html>
